name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }

      - name: JVM
        run: clojure -M:test

      - run: npm install -g nbb
      # Not a duplicate. The ClojureScript runs found three defects here that
      # the JVM suite did not: Node Buffer pooling, a precision refusal raised
      # in the wrong layer, and int64 rounding past 2^53.
      - name: ClojureScript (nbb, interpreted)
        run: nbb --classpath "src:test:$(clojure -Spath)" test/run.cljs
      - name: ClojureScript (cljs.main, compiled)
        run: clojure -M:cljs -m cljs.main --target node -m parquet.cljs-runner

      - name: lint
        run: clojure -M:lint

      # The claim the in-repo suite CANNOT make. `parquet.writer-test` shares a
      # code base with the reader, so the failures that matter most pass it.
      # Two were measured while building the writer, and BOTH were green here:
      #
      #   1. `ColumnChunk.file_offset` omitted -- `required` in the thrift IDL,
      #      never read by us. Round-tripped perfectly; pyarrow could not
      #      deserialize the footer at all.
      #   2. `FileMetaData.column_orders` omitted -- every file opened, every
      #      value correct, and EVERY STATISTIC invisible, because the spec
      #      forbids trusting min_value/max_value with no declared sort order.
      #      Parquet was chosen over a sidecar precisely so other tools could
      #      read the statistics, so that was a total failure of the writer's
      #      purpose that nothing inside this repo could see.
      - name: files we WROTE are accepted by the reference reader
        run: |
          python3 -m venv /tmp/pqv && /tmp/pqv/bin/pip install --quiet pyarrow
          mkdir -p /tmp/parquet-out
          clojure -M:emit /tmp/parquet-out
          /tmp/pqv/bin/python test/fixtures/verify_written.py /tmp/parquet-out

      # The fixtures must stay byte-identical to what the reference writer
      # produces, or the suite is testing this repo against its own past
      # misunderstanding rather than against Parquet.
      - name: fixtures still match the reference writer
        run: |
          python3 -m venv /tmp/pq && /tmp/pq/bin/pip install --quiet pyarrow
          /tmp/pq/bin/python test/fixtures/generate.py
          # gzip.parquet is excluded on purpose: deflate output is
          # implementation-dependent, so byte-equality across environments is
          # not a property it has. Measured — identical locally, different
          # here. Its correctness is checked by decoding it and comparing
          # values with plain.parquet instead.
          git diff --exit-code -- test/fixtures ':!test/fixtures/gzip.parquet'
